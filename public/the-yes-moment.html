<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will you marry me?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap">
<style>
:root{--ink:#7a1f4b;--pk:#ff3d86;--pk2:#ff8fc0;--soft:#ffe3ef;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#ffc2da}
body{color:var(--ink);font-family:"Quicksand","Trebuchet MS",sans-serif;text-align:center;background:linear-gradient(135deg,#ffd6e7,#ffb3d1,#ffc9e0,#ffe3ef,#ffb3d1);background-size:400% 400%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
#hc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;gap:10px;padding:calc(28px + env(safe-area-inset-top,0px)) 22px calc(40px + env(safe-area-inset-bottom,0px));opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s}
.screen::-webkit-scrollbar{display:none}
#B{justify-content:center}
.screen.on{opacity:1;visibility:visible}
h1,h2{font-family:"Dancing Script",cursive;font-weight:700;margin:0;background:linear-gradient(90deg,#ff3d86,#ff77aa,#c2185b,#ff3d86);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:300% 0}}
h1{font-size:clamp(44px,13vw,70px);line-height:1.1}
.tag{font-size:15px;letter-spacing:5px;text-transform:uppercase;margin:0;color:#b02a68;font-weight:600}
.note{margin:18px 0 0;font-size:15px;opacity:.8}
.btn{font:inherit;font-weight:600;font-size:20px;border:0;border-radius:99px;padding:14px 38px;cursor:pointer;transition:transform .45s cubic-bezier(.3,1.3,.5,1),box-shadow .2s}
.yes{position:relative;z-index:3;background:linear-gradient(135deg,#ff3d86,#ff77aa);color:#fff;box-shadow:0 8px 26px rgba(255,61,134,.5);transform-origin:center}
.no{background:#fff;color:var(--ink);border:2px solid var(--pk2);box-shadow:0 4px 14px rgba(255,61,134,.2)}
.ans{display:flex;flex-direction:column;gap:22px;justify-content:flex-start;align-items:center;min-height:170px;margin-top:34px;opacity:0;transition:opacity 1s}
.ans.show{opacity:1}
.hd{width:110px;overflow:visible;filter:drop-shadow(0 0 12px rgba(255,61,134,.5));animation:beat 1.6s ease-in-out 3s infinite}
.hd path{fill:rgba(255,61,134,0);stroke:#ff3d86;stroke-width:1.1;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:dr 2.6s ease forwards,fl 1s 2.4s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fl{to{fill:#ff3d86}}
@keyframes beat{30%{transform:scale(1.15)}}
.ty{font-family:"Dancing Script",cursive;font-size:clamp(28px,8vw,40px);min-height:150px;line-height:1.35;margin:14px 0;max-width:420px}
.ty i{display:inline-block;width:2px;height:1em;background:var(--pk);margin-left:3px;animation:bl 1s steps(2) infinite;vertical-align:-3px}
@keyframes bl{50%{opacity:0}}
#go{opacity:0;visibility:hidden;transition:opacity 1s}#go.show{opacity:1;visibility:visible;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.08)}}
.rw{position:relative;width:170px;height:170px;margin-bottom:6px}
.rays{position:absolute;inset:-70px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.7) 0 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,#000 15%,transparent 66%);mask:radial-gradient(circle,#000 15%,transparent 66%);animation:sp 16s linear infinite;opacity:0;transition:opacity 2s}
.on .rays{opacity:1}
@keyframes sp{to{transform:rotate(360deg)}}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 14px rgba(194,24,91,.4));opacity:0;transform:translateY(90px) scale(.5)}
.on .ring{animation:rise 1.8s .5s cubic-bezier(.2,1.2,.4,1) forwards,bob 3s 2.4s ease-in-out infinite}
@keyframes rise{to{opacity:1;transform:none}}@keyframes bob{50%{transform:translateY(-8px)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.2);opacity:.3}}
#q,#B .tag,#B .note{opacity:0;transform:translateY(16px);transition:1.2s}
#B.on .tag{opacity:1;transform:none;transition-delay:1.6s}#B.on #q{opacity:1;transform:none;transition-delay:2.2s}#B.on .note{opacity:.8;transform:none;transition-delay:2.8s}
.boy{width:150px;overflow:visible;margin-top:70px}
.bj{transform-origin:80px 226px;animation:jump .9s ease-in-out infinite}
@keyframes jump{0%,12%,88%,100%{transform:translateY(0) scale(1.05,.95)}50%{transform:translateY(-70px) scale(.97,1.03)}}
.bsh{transform-origin:80px 232px;animation:shd .9s ease-in-out infinite}
@keyframes shd{0%,12%,88%,100%{transform:scale(1);opacity:.2}50%{transform:scale(.55);opacity:.1}}
.a1{transform-origin:54px 100px;animation:wl .9s ease-in-out infinite}.a2{transform-origin:106px 100px;animation:wr .9s ease-in-out infinite}
@keyframes wl{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}@keyframes wr{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-14deg)}}
.ll{transform-origin:69px 150px;animation:kl .9s ease-in-out infinite}.lr{transform-origin:91px 150px;animation:kr .9s ease-in-out infinite}
@keyframes kl{50%{transform:rotate(16deg)}}@keyframes kr{50%{transform:rotate(-16deg)}}
#C p{max-width:400px;font-size:19px;margin:4px 0}
.nm{font-family:"Dancing Script",cursive;font-size:40px;color:#c2185b}
</style>
</head>
<body>
<canvas id="hc"></canvas>
<div id="A" class="screen on">
<svg class="hd" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>
<p class="ty" id="ty"></p><button class="btn yes" id="go">I'm ready</button></div>
<div id="B" class="screen">
<div class="rw"><div class="rays"></div>
<svg class="ring" viewBox="0 0 160 170"><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8860b"/><stop offset=".5" stop-color="#ffe9a0"/><stop offset="1" stop-color="#b8860b"/></linearGradient><linearGradient id="df" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#bfe6ff"/><stop offset="1" stop-color="#e9d5ff"/></linearGradient></defs>
<circle cx="80" cy="118" r="36" fill="none" stroke="url(#gl)" stroke-width="9"/><circle cx="80" cy="118" r="31" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><path d="M68 84L74 72H86L92 84Z" fill="url(#gl)"/><polygon points="80,22 106,46 80,80 54,46" fill="url(#df)" stroke="#fff" stroke-width="1.5"/><path d="M54 46H106M80 22L67 46L80 80L93 46Z" fill="none" stroke="#9ad0f5" stroke-width="1.2"/>
<path class="tw" d="M126 26l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff"/><path class="tw" style="animation-delay:.6s" d="M30 60l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#fff"/><path class="tw" style="animation-delay:1s" d="M104 12l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffd1e6"/></svg></div>
<p class="tag" id="hn"></p><h1 id="q"></h1><p class="note" id="nt"></p><div class="ans" id="ans"><button class="btn yes" id="yes">Yes!</button><button class="btn no" id="no">No</button></div></div>
<div id="C" class="screen">
<svg class="boy" viewBox="0 0 160 240"><ellipse class="bsh" cx="80" cy="232" rx="36" ry="6" fill="#7a1f4b"/><g class="bj"><g class="ll"><rect x="60" y="150" width="19" height="64" rx="7" fill="#22294a"/><ellipse cx="68" cy="217" rx="14" ry="7" fill="#151515"/></g><g class="lr"><rect x="81" y="150" width="19" height="64" rx="7" fill="#22294a"/><ellipse cx="92" cy="217" rx="14" ry="7" fill="#151515"/></g><g class="a1"><line x1="54" y1="100" x2="26" y2="52" stroke="#24305e" stroke-width="17" stroke-linecap="round"/><circle cx="24" cy="48" r="9" fill="#ffd3b0"/></g><g class="a2"><line x1="106" y1="100" x2="134" y2="52" stroke="#24305e" stroke-width="17" stroke-linecap="round"/><circle cx="136" cy="48" r="9" fill="#ffd3b0"/></g><rect x="72" y="76" width="16" height="18" fill="#ffd3b0"/><path d="M50 96Q80 84 110 96L114 160H46Z" fill="#24305e"/><polygon points="68,92 92,92 80,128" fill="#fff"/><polygon points="60,92 70,92 80,128 64,112" fill="#1a2350"/><polygon points="100,92 90,92 80,128 96,112" fill="#1a2350"/><polygon points="76,100 84,100 87,126 80,136 73,126" fill="#ff3d86"/><rect x="75" y="96" width="10" height="8" rx="2" fill="#e0245e"/><circle cx="80" cy="150" r="2.2" fill="#c9a86a"/><circle cx="80" cy="56" r="26" fill="#ffd3b0"/><circle cx="54" cy="58" r="5" fill="#ffd3b0"/><circle cx="106" cy="58" r="5" fill="#ffd3b0"/><path d="M53 54Q52 28 80 29Q108 28 107 54Q96 40 80 42Q64 40 53 54Z" fill="#3d2717"/><path d="M66 58Q70 52 74 58M86 58Q90 52 94 58" stroke="#333" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M67 67Q80 84 93 67Z" fill="#a4283d"/><path d="M73 75Q80 80 87 75Q80 71 73 75Z" fill="#ff8fa3"/><circle cx="63" cy="68" r="5" fill="#ff9db5" opacity=".7"/><circle cx="97" cy="68" r="5" fill="#ff9db5" opacity=".7"/></g></svg>
<h1 id="yt"></h1><p id="ym"></p><p class="nm" id="nm"></p><p class="tag" id="yd"></p></div>
<script>
const CONFIG={him:"Mohamed",her:"Farah",dateText:"September 28, 2026",lines:["Hey {her}...","I have something very important to ask you.","Are you ready?"],question:"Will you marry me?",note:"Choose wisely...",noTexts:["No","Are you sure?","Think again","Really?","Nope","Try Yes!"],yesTitle:"You said YES!",yesMsg:"You just made me the happiest person alive. I love you today, tomorrow, and forever."};
const $=id=>document.getElementById(id),C=CONFIG;
$("hn").textContent=C.her;$("q").textContent=C.question;$("nt").textContent=C.note;$("yt").textContent=C.yesTitle;$("ym").textContent=C.yesMsg;$("nm").textContent=C.him+" & "+C.her;$("yd").textContent=C.dateText;
const cv=$("hc"),cx=cv.getContext("2d");let W,H,B=[];const HC=["#ff3d86","#ff77aa","#ffa6c9","#ff5c99","#fff0f6","#e0245e"];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
function hp(x,y,s,c,a,r){cx.save();cx.translate(x,y);cx.rotate(r);cx.scale(s,s);cx.globalAlpha=a;cx.fillStyle=c;cx.beginPath();cx.moveTo(0,-.35);cx.bezierCurveTo(0,-.9,-1,-.9,-1,-.25);cx.bezierCurveTo(-1,.25,-.4,.55,0,1);cx.bezierCurveTo(.4,.55,1,.25,1,-.25);cx.bezierCurveTo(1,-.9,0,-.9,0,-.35);cx.fill();cx.restore()}
const amb=Array.from({length:26},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:5+Math.random()*12,v:.3+Math.random()*.7,p:Math.random()*6,c:HC[(Math.random()*6)|0],a:.25+Math.random()*.4}));
function burst(x,y,n,big){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(big?3:1.5)+Math.random()*(big?7:3);B.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(big?3:1),s:5+Math.random()*(big?12:6),c:HC[(Math.random()*6)|0],l:1,r:Math.random()*6,vr:(Math.random()-.5)*.2})}}
let T=0;(function loop(){T+=.02;cx.clearRect(0,0,W,H);amb.forEach(h=>{h.y-=h.v;h.x+=Math.sin(T+h.p)*.5;if(h.y<-20){h.y=H+20;h.x=Math.random()*W}hp(h.x,h.y,h.s,h.c,h.a,Math.sin(T+h.p)*.4)});B=B.filter(b=>{b.vy+=.12;b.vx*=.99;b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;b.l-=.008;hp(b.x,b.y,b.s,b.c,Math.max(b.l,0),b.r);return b.l>0&&b.y<H+30});requestAnimationFrame(loop)})();
const L=C.lines.map(l=>l.replace("{her}",C.her));let li=0,ci=0,txt="";function typ(){if(li>=L.length){$("go").classList.add("show");return}const l=L[li];if(ci<l.length){txt+=l[ci++];$("ty").innerHTML=txt+"<i></i>";setTimeout(typ,55)}else{txt+="<br>";li++;ci=0;setTimeout(typ,700)}}setTimeout(typ,1800);
$("go").onclick=()=>{$("A").classList.remove("on");burst(innerWidth/2,innerHeight/2,60,true);setTimeout(()=>{$("B").classList.add("on");burst(innerWidth/2,innerHeight*.3,50,true)},900);setTimeout(()=>{$("ans").classList.add("show");ready=true},4200)};
let ready=false,esc=0,ph=null,lastH=0,lk=0;const yes=$("yes"),no=$("no");function grow(){const cap=Math.min(2.6,(innerWidth-40)/yes.offsetWidth);yes.style.transform=`scale(${Math.min(1+Math.min(esc*.14,1.3)+lk*.5,cap)})`}
function near(el,x,y,pad){const r=el.getBoundingClientRect();return x>r.left-pad&&x<r.right+pad&&y>r.top-pad&&y<r.bottom+pad}
function run(px,py){esc++;grow();const r=no.getBoundingClientRect(),w=r.width,h=r.height;if(!ph){ph=document.createElement("span");ph.style.cssText=`display:inline-block;width:${w}px;height:${h}px`;no.parentNode.insertBefore(ph,no);no.style.position="fixed";no.style.left=r.left+"px";no.style.top=r.top+"px";no.style.zIndex=5;no.offsetWidth;no.style.transition="left .3s,top .3s,transform .3s"}const yr=yes.getBoundingClientRect();let x,y,ok=0;for(let i=0;i<90&&!ok;i++){x=16+Math.random()*(innerWidth-w-32);y=16+Math.random()*(innerHeight-h-32);const dx=x+w/2-px,dy=y+h/2-py;ok=Math.hypot(dx,dy)>170&&!(x<yr.right+30&&x+w>yr.left-30&&y<yr.bottom+30&&y+h>yr.top-30)}no.style.left=x+"px";no.style.top=y+"px";no.style.transform=`scale(${Math.max(.6,1-esc*.05)}) rotate(${(Math.random()-.5)*20}deg)`;no.textContent=C.noTexts[esc%C.noTexts.length]}
function move(e){if(!ready)return;const x=e.clientX,y=e.clientY,r=yes.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2)),k=Math.max(0,1-d/260);lk=k;grow();if(k>.55&&performance.now()-lastH>140){lastH=performance.now();burst(r.left+r.width/2,r.top+r.height/2,3,false)}if(near(no,x,y,60))run(x,y)}
addEventListener("pointermove",move);addEventListener("pointerdown",move);no.addEventListener("click",e=>{e.preventDefault();run(e.clientX,e.clientY)});
yes.onclick=()=>{$("B").classList.remove("on");no.style.display="none";setTimeout(()=>{$("C").classList.add("on");burst(innerWidth/2,innerHeight/2,120,true)},700);let n=0;const t=setInterval(()=>{burst(Math.random()*innerWidth,innerHeight*(.2+Math.random()*.5),40,true);if(++n>8)clearInterval(t)},700)};
</script>
</body>
</html>
